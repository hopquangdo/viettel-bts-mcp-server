spring:
  application:
    name: mcp-server
  flyway:
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  ai:
    mcp:
      server:
        name: viettel-bts-mcp
        version: 0.1.0
        protocol: STREAMABLE

server:
  port: ${MCP_SERVER_PORT:8081}

app:
  mcp:
    api-key: ${APP_MCP_API_KEY:}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health