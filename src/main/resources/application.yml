spring:
  application:
    name: mcp-server
  flyway:
    enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  ai:
    mcp:
      server:
        name: viettel-bts-mcp
        version: 0.1.0
        protocol: STREAMABLE

server:
  port: ${MCP_SERVER_PORT:8081}

app:
  data-scope:
    # Tạm thời cho phép MCP đọc toàn bộ dữ liệu; bật lại bằng APP_DATA_SCOPE_ENABLED=true.
    enabled: false
  mcp:
    api-key: ${APP_MCP_API_KEY:}
  cache:
    # RedisCacheService (CanBoComponent, NhaThauResolver...). Đặt APP_CACHE_ENABLED=false để tắt cache.
    enabled: ${APP_CACHE_ENABLED:true}
    key-prefix: ${APP_CACHE_KEY_PREFIX:bts-ops}
    contractor-scope-ttl-seconds: ${APP_CACHE_CONTRACTOR_SCOPE_TTL:60}
    phanquyen-authority-ttl-seconds: ${APP_CACHE_PHANQUYEN_AUTHORITY_TTL:900}
    sanluong-tonghop-ttl-seconds: ${APP_CACHE_SANLUONG_TONGHOP_TTL:86400}
    sanluong-doi-tuong-row-ttl-seconds: ${APP_CACHE_SANLUONG_DOI_TUONG_ROW_TTL:86400}
    name-lookup-ttl-seconds: ${APP_CACHE_NAME_LOOKUP_TTL:300}
    volume-batch-ttl-seconds: ${APP_CACHE_VOLUME_BATCH_TTL:86400}
    hop-dong-doi-tuong-snapshot-ttl-seconds: ${APP_CACHE_HOPDONG_DOITUONG_SNAPSHOT_TTL:86400}
    vuong-mac-row-ttl-seconds: ${APP_CACHE_VUONG_MAC_ROW_TTL:86400}
    hop-dong-doi-tuong-report-ttl-seconds: ${APP_CACHE_HOPDONG_DOITUONG_REPORT_TTL:86400}

management:
  endpoints:
    web:
      exposure:
        include: health