# CI/CD: test (PR + dev + main) -> build image (dev + main) -> deploy lên k3s -> release (chỉ main):
#   main -> namespace viettel-prod (vietdemo.com), dev -> namespace viettel-dev (qwen.vietdemo.com).
#   Deploy main thành công -> tag vX.Y.Z + nhánh release/vX.Y.Z + GitHub Release + image :vX.Y.Z.
#   Luồng đầy đủ: docs/ci-cd-release-flow.md (repo gốc).
#
# Các bước build / deploy / release dùng chung, nằm ở repo hopquangdo/viettel-vtk-deploy (thư mục actions/),
# được checkout vào .ci/ ở mỗi job.
#
# Secrets cấp repo (Settings > Secrets and variables > Actions > Repository secrets):
#   DEPLOY_REPO_TOKEN                                             fine-grained PAT, Contents: Read-only trên viettel-vtk-deploy
#   GHCR_USERNAME, GHCR_TOKEN                                     (tùy chọn) PAT write:packages; nếu có sẽ dùng thay GITHUB_TOKEN
#
# Secrets theo environment (Settings > Environments): "production" cho main, "development" cho dev -- mỗi bên tự khai báo:
#   SSH_HOST, SSH_PORT (mặc định 22), SSH_USER, SSH_PRIVATE_KEY   vào server chạy k3s
#   KUBE_NAMESPACE                                                (tùy chọn, chỉ production) mặc định viettel-prod;
#                                                                 dev luôn deploy vào viettel-dev
#
# Sau khi mcp-server rollout xong: tự `rollout restart` ai-assistant để nó reconnect MCP và nạp lại tool
# mới -- ai-assistant chỉ discover tool 1 lần lúc khởi động (cache trong process).

name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      bump:
        description: Mức tăng version khi release (auto = theo commit message)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# Không hủy lần chạy đang deploy ở main/dev.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

permissions:
  contents: read
  packages: write

env:
  DEPLOYMENT: mcp-server
  IMAGE_NAME: ${{ github.repository_owner }}/mcp-server
  CI_REPO: hopquangdo/viettel-vtk-deploy
  CI_REF: main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew && ./gradlew test --no-daemon

  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request'
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: "${{ env.CI_REPO }}", ref: "${{ env.CI_REF }}", token: "${{ secrets.DEPLOY_REPO_TOKEN }}", path: .ci }
      - id: image
        uses: ./.ci/actions/build-image
        with:
          image-name: ${{ env.IMAGE_NAME }}
          registry-username: ${{ (secrets.GHCR_TOKEN != '' && secrets.GHCR_USERNAME) || github.actor }}
          registry-password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          cache-scope: mcp-server

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && github.event_name != 'pull_request'
    # dev và prod tách biệt: environment riêng (secrets, reviewers riêng) và hàng đợi deploy riêng.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    concurrency:
      group: k8s-deploy-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { repository: "${{ env.CI_REPO }}", ref: "${{ env.CI_REF }}", token: "${{ secrets.DEPLOY_REPO_TOKEN }}", path: .ci }
      - uses: ./.ci/actions/deploy-k8s
        with:
          deployment: ${{ env.DEPLOYMENT }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ needs.build.outputs.tag }}
          prod-namespace: ${{ secrets.KUBE_NAMESPACE || 'viettel-prod' }}
          # dev cố định viettel-dev, không đọc KUBE_NAMESPACE: tránh secret cấp repo đẩy bản dev vào prod.
          dev-namespace: viettel-dev
          restart-after: ai-assistant
          ssh-host: ${{ secrets.SSH_HOST }}
          ssh-user: ${{ secrets.SSH_USER }}
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-port: ${{ secrets.SSH_PORT || '22' }}

  release:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: "${{ env.CI_REPO }}", ref: "${{ env.CI_REF }}", token: "${{ secrets.DEPLOY_REPO_TOKEN }}", path: .ci }
      - uses: ./.ci/actions/release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tag: ${{ needs.build.outputs.tag }}
          registry-username: ${{ (secrets.GHCR_TOKEN != '' && secrets.GHCR_USERNAME) || github.actor }}
          registry-password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          bump: ${{ inputs.bump || 'auto' }}
